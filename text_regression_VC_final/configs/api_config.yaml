models:
  distilbert:
    display_name: "DistilBERT (fine-tune)"
    name: distilbert-base-uncased
    strategy: finetune
    dropout: 0.1
    checkpoint_path: artifacts/distilbert_finetune_imdb_seed42/checkpoints/best.pt

  bert:
    display_name: "BERT (fine-tune)"
    name: bert-base-uncased
    strategy: finetune
    dropout: 0.1
    checkpoint_path: artifacts/bert_finetune_imdb_seed42/checkpoints/best.pt

  roberta:
    display_name: "RoBERTa (fine-tune)"
    name: roberta-base
    strategy: finetune
    dropout: 0.1
    checkpoint_path: artifacts/roberta_finetune_imdb_seed42/checkpoints/best.pt

default_model: distilbert
max_length: 256

inference:
  device: auto                         # auto | cpu | cuda

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"                              # dev only

ui:
  api_url: http://localhost:8000
